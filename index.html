<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Español Avanzado – Para Gringos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: auto 0;
    }

    .header {
      width: 100%;
      text-align: center;
    }

    .header h1 {
      font-size: 1.4rem;
      margin: 0 0 4px 0;
      color: var(--text);
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .category-select {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--subtext);
      font-size: 0.85rem;
    }

    .badge {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .grammar-pill {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .sentence-box {
      width: 100%;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 500;
      border: 1px solid var(--border);
      line-height: 1.4;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      padding: 20px 16px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
    }

    .spanish-word {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1.25;
    }

    .english-word {
      font-size: 1rem;
      color: var(--subtext);
      font-weight: 400;
      line-height: 1.3;
    }

    .audio-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
